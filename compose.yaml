
services:

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todo_app
      DB_USERNAME: todo_app
      DB_PASSWORD: ismail@7012
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: todo-db
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: ismail@7012
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_app -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
